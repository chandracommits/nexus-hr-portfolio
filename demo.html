
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus HR | Interactive Demo</title>
  <meta name="description" content="Explore Nexus HR, an AI-powered Human Resource Intelligence Platform.">

  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #090d1b;
      color: #f4f6ff;
      font: 15px system-ui, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .bar {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 22px;
      background: #10182b;
      border-bottom: 1px solid #2a3450;
    }

    .brand {
      font-weight: 800;
      font-size: 19px;
      color: #f4f6ff;
      text-decoration: none;
    }

    .brand span { color: #9d8aff; }

    .links {
      display: flex;
      gap: 10px;
    }

    a.button {
      padding: 10px 14px;
      border: 1px solid #465174;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: 650;
    }

    a.button:hover {
      background: #242f4d;
    }

    .info {
      padding: 10px 20px;
      text-align: center;
      background: #1b2340;
      color: #d2d9f0;
      font-size: 13px;
    }

    .frame {
      flex: 1;
      min-height: 400px;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .footer {
      padding: 9px 16px;
      color: #9faecb;
      text-align: center;
      font-size: 12px;
      background: #0b1120;
    }

    @media (max-width: 600px) {
      .bar { padding: 10px; }
      .brand { font-size: 16px; }
      a.button { font-size: 12px; padding: 8px; }
      .info { font-size: 12px; }
    }
  </style>
</head>

<body>
  <header class="bar">
    <a class="brand" href="index.html">
      <span>⬡</span> Nexus HR
      <small> / Live Demo</small>
    </a>

    <div class="links">
      <a class="button" href="index.html">← Portfolio</a>
    </div>
  </header>

  <div class="info">
    Interactive Product Showcase · Synthetic Demo Data ·
    Explore HR Admin and Employee Experiences
  </div>

  <main class="frame">
    <iframe
      title="Nexus HR Interactive Application"
      src="https://ai-hr-hub-4.emergent.host"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

  <footer class="footer">
    © 2026 Nexus HR · AI-Powered Human Resource Intelligence Platform
  </footer>
</body>
</html>
